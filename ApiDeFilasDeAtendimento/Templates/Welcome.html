<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
        }

        .header {
            background-color: #007bff;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .content {
            padding: 30px;
            background-color: #ffffff;
        }

        .footer {
            background-color: #f8f9fa;
            color: #6c757d;
            padding: 20px;
            text-align: center;
            font-size: 12px;
        }

        .button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Bem-vindo(a)!</h1>
        </div>
        <div class="content">
            <h2>Olá, {nome}!</h2>
            <p>É um prazer ter você no nosso <strong>Sistema de Filas de Atendimento</strong>.</p>
            <p>Seu cadastro foi realizado com sucesso. Agora você já pode acessar o painel para gerenciar os totens e atendimentos.</p>
            <a href="{link}" class="button">Acessar Painel</a>
        </div>
        <div class="footer">
            <p>&copy; 2026 Sistema de Filas - Todos os direitos reservados.</p>
        </div>
    </div>
</body>
</html>
